question: How many engagement records show low engagement according to their engagement rate?
drift_type: documented
entries:
- id: 5
  oracle_definition: Engagement rate (engrate) typically ranges from 0 to 1.000, with higher values indicating more active fans. 0-0.240 represents low engagement (viewing only without participation), 0.241-0.500 indicates moderate engagement (occasional comments and likes), 0.501-0.800 shows high engagement (frequent comments and sharing), and 0.801-1.000 represents ultra-high engagement (comprehensive deep participation in content co-creation). Platforms generally consider rates above 0.500 as quality fans.
