    type: calculation_knowledge
    children_knowledge: -1
  gold_sql: WITH base AS (SELECT a.accindex, 0.3 * m.credscore + 0.3 * m.reputscore + 0.4 * json_extract(p.profile_composition, '$.completeness') AS pci, 0.3 * m.authenscore + 0.3 * c.cntuniqscore + 0.4 * g.convnatval AS cas, 0.4 * (1 - c.cntuniqscore) + 0.3 * c.mediareratio + 0.3 * (1 - g.txtuniq) AS cms, 0.3 * m.abuserepnum / 1000.0 + 0.4 * m.impactval + 0.3 * json_extract(s.detection_score_profile, '$.overall.riskval') AS mps, m.netinflscore FROM account a JOIN profile p ON TRIM(p.profaccref) = TRIM(a.accindex) JOIN sessionbehavior sb ON TRIM(sb.sessprofref) = TRIM(p.profkey) JOIN contentbehavior c ON TRIM(c.cntsessref) = TRIM(sb.sessref) JOIN moderationaction m ON TRIM(m.macntref) = TRIM(c.cntref) JOIN securitydetection s ON TRIM(s.secdetkey) = TRIM(m.masedetref) JOIN messaginganalysis g ON TRIM(g.msgcntref) = TRIM(c.cntref)) SELECT COUNT(DISTINCT accindex) AS trusted_content_creators FROM base WHERE 0.5 * pci + 0.5 * cas > 0.8 AND cms * mps * netinflscore / 100.0 < 0.2
