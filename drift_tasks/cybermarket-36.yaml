  gold_sql: SELECT AVG(apl * 0.5 + sps * 0.2 + tornodecount * 2 + enc * 5 - iptally * 0.5) AS avg_osi FROM (SELECT (CASE c.vpnflag WHEN 'Yes' THEN 1 WHEN 'Suspected' THEN 0.5 ELSE 0 END) * 30 + c.tornodecount * 2 + (CASE c.encryptmethod WHEN 'Standard' THEN 1 WHEN 'Enhanced' THEN 2 WHEN 'Custom' THEN 3 ELSE 0 END) * 15 + c.connpatscore * 0.2 + c.brwsrunique / 20.0 AS apl, (100 - s.vulntally * 5) + s.securitymeasurecount * 2 + s.sessionsecurityscore * 0.5 + s.privprotscore * 0.3 - s.fpprob * 100 AS sps, c.tornodecount, (CASE c.encryptmethod WHEN 'Standard' THEN 1 WHEN 'Enhanced' THEN 2 WHEN 'Custom' THEN 3 ELSE 0 END) AS enc, c.iptally FROM communication c JOIN securitymonitoring s ON TRIM(s.commref) = TRIM(c.commregistry))
