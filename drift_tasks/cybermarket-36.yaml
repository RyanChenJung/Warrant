id: cybermarket-36-operational-security-index
database: cybermarket
question: Taking each communication record together with its security monitoring record, what is the average Operational Security Index (OSI) over the records for which it can be computed?
drift_type: documented
entries:
- id: 36
  oracle_definition: OSI = (APL \times 0.4) + (SPS \times 0.2) + (tornodecount \times 2) + (CASE WHEN encryptmethod = 'Standard' THEN 1 WHEN encryptmethod = 'Enhanced' THEN 2 WHEN encryptmethod = 'Custom' THEN 3 ELSE 0 END \times 5) - (iptally \times 0.5), \text{where APL and SPS are defined by the Anonymity Protection Level and Security Posture Score respectively, and higher scores indicate stronger operational security.}
  stored_answer: OSI = (APL \times 0.5) + (SPS \times 0.2) + (tornodecount \times 2) + (CASE WHEN encryptmethod = 'Standard' THEN 1 WHEN encryptmethod = 'Enhanced' THEN 2 WHEN encryptmethod = 'Custom' THEN 3 ELSE 0 END \times 5) - (iptally \times 0.5), \text{where APL and SPS are defined by the Anonymity Protection Level and Security Posture Score respectively, and higher scores indicate stronger operational security.}
- id: 17
  oracle_definition: SPS = (100 - (vulntally \times 5)) + (securitymeasurecount \times 2) + (sessionsecurityscore \times 0.5) + (privprotscore \times 0.3) - (fpprob \times 100), \text{where higher scores indicate stronger security postures.}
  stored_answer: SPS = (100 - (vulntally \times 5)) + (securitymeasurecount \times 2) + (sessionsecurityscore \times 0.5) + (privprotscore \times 0.3) - (fpprob \times 100), \text{where higher scores indicate stronger security postures.}
- id: 19
  oracle_definition: APL = (vpnflag\_numeric \times 30) + (tornodecount \times 2) + (encryptmethod\_numeric \times 15) + (connpatscore \times 0.2) + \frac{brwsrunique}{20}, \text{where vpnflag\_numeric maps Yes=1, Suspected=0.5, No=0, encryptmethod\_numeric maps Standard=1, Enhanced=2, Custom=3, else=0 and higher scores indicate stronger anonymity protections.}
  stored_answer: APL = (vpnflag\_numeric \times 30) + (tornodecount \times 2) + (encryptmethod\_numeric \times 15) + (connpatscore \times 0.2) + \frac{brwsrunique}{20}, \text{where vpnflag\_numeric maps Yes=1, Suspected=0.5, No=0, encryptmethod\_numeric maps Standard=1, Enhanced=2, Custom=3, else=0 and higher scores indicate stronger anonymity protections.}
