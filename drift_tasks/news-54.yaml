  gold_sql: WITH s AS (SELECT seshkey, bncrate * (1 - ctrval / 100.0) AS adjusted_bounce_rate, ctrval FROM sessions), p AS (SELECT seshkey, PERCENT_RANK() OVER (ORDER BY adjusted_bounce_rate) AS bounce_percentile, PERCENT_RANK() OVER (ORDER BY ctrval DESC) AS ctr_percentile FROM s) SELECT COUNT(*) AS high_bounce_low_ctr_sessions FROM p WHERE bounce_percentile < 0.25 AND ctr_percentile < 0.25
