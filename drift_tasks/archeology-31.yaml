# Documented drift task (#43), drafted with Claude Code.
# Draw position: 6. Entry: archeology 31 (Environmental Impact Factor (EIF)).
# Old value: 10 (the offset added to ESI in the denominator). New value: 12. Direction used: up (drawn).
# Restating entries changed: none (no other entry states the ESI offset of EIF).
# Entries built on (unchanged): 3, 7, 0, 1.
# Gold results: pre-drift 9.6081, post-drift 19.8698 (1125 scan/environment pairs).
# Fixed after checking: the question states that the average is over scan and reading pairs.
id: archeology-31-environmental-impact-factor
database: archeology
question: Taking each pair of a scan's point cloud and an environment reading at the scan's site as one case, what is the average Environmental Impact Factor (EIF) over all such pairs?
drift_type: documented
entries:
- id: 31
  oracle_definition: EIF = \frac{SQS}{\text{ESI} + 12} \times 100, \text{ where SQS is the Scan Quality Score and ESI is the Environmental Suitability Index. Values closer to 100 indicate minimal environmental interference with data acquisition.}
  stored_answer: EIF = \frac{SQS}{\text{ESI} + 10} \times 100, \text{ where SQS is the Scan Quality Score and ESI is the Environmental Suitability Index. Values closer to 100 indicate minimal environmental interference with data acquisition.}
- id: 3
  oracle_definition: SQS = \left(\frac{10}{SRI}\right)^{1.5} \times \left(\frac{SCE}{100}\right) \times \left(1 - \frac{NoiseDb}{30}\right)^2, \text{ where higher values indicate exponentially better overall scan quality with emphasis on resolution.}
  stored_answer: SQS = \left(\frac{10}{SRI}\right)^{1.5} \times \left(\frac{SCE}{100}\right) \times \left(1 - \frac{NoiseDb}{30}\right)^2, \text{ where higher values indicate exponentially better overall scan quality with emphasis on resolution.}
- id: 7
  oracle_definition: ESI = 100 - 2.5 \times \left|AmbicTemp - 20\right| - \left|\frac{HumePct - 50}{2}\right|^{1.5} - \frac{600}{IllumeLux + 100}, \text{ where higher values indicate more ideal scanning conditions adjusted for relative importance.}
  stored_answer: ESI = 100 - 2.5 \times \left|AmbicTemp - 20\right| - \left|\frac{HumePct - 50}{2}\right|^{1.5} - \frac{600}{IllumeLux + 100}, \text{ where higher values indicate more ideal scanning conditions adjusted for relative importance.}
- id: 0
  oracle_definition: SRI = \frac{\log_{10}(ScanResolMm \times 10^3)}{\log_{10}(PointDense)} \times 5, \text{ where lower values indicate higher quality resolution and more balanced scanning parameters.}
  stored_answer: SRI = \frac{\log_{10}(ScanResolMm \times 10^3)}{\log_{10}(PointDense)} \times 5, \text{ where lower values indicate higher quality resolution and more balanced scanning parameters.}
- id: 1
  oracle_definition: SCE = CoverPct \times \left(1 + \frac{LapPct}{100} \times \left(1 - \frac{CoverPct}{100}\right)\right), \text{ where higher values indicate more effective coverage with appropriate overlap.}
  stored_answer: SCE = CoverPct \times \left(1 + \frac{LapPct}{100} \times \left(1 - \frac{CoverPct}{100}\right)\right), \text{ where higher values indicate more effective coverage with appropriate overlap.}
