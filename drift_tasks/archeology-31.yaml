    knowledge: Environmental Suitability Index (ESI)
    description: Evaluates how suitable environmental conditions were for scanning operations using weighted parameters.
    definition: ESI = 100 - 2.5 \times \left|AmbicTemp - 20\right| - \left|\frac{HumePct - 50}{2}\right|^{1.5} - \frac{600}{IllumeLux + 100}, \text{ where higher values indicate more ideal scanning conditions adjusted for relative importance.}
    type: calculation_knowledge
    children_knowledge: -1
  - id: 0
    version: 1
    knowledge: Scan Resolution Index (SRI)
    description: A sophisticated compound index measuring the overall resolution quality of a scan based on resolution and point density.
    definition: SRI = \frac{\log_{10}(ScanResolMm \times 10^3)}{\log_{10}(PointDense)} \times 5, \text{ where lower values indicate higher quality resolution and more balanced scanning parameters.}
    type: calculation_knowledge
    children_knowledge: -1
  - id: 1
    version: 1
    knowledge: Scan Coverage Effectiveness (SCE)
    description: Measures how effectively a scan covers its target area considering both coverage percentage and overlap redundancy.
    definition: SCE = CoverPct \times \left(1 + \frac{LapPct}{100} \times \left(1 - \frac{CoverPct}{100}\right)\right), \text{ where higher values indicate more effective coverage with appropriate overlap.}
    type: calculation_knowledge
    children_knowledge: -1
  gold_sql: WITH pc AS (SELECT TRIM(arcref) AS arcref, TRIM(crewref) AS crewref, LOG10(scanresolmm * 1000) / LOG10(pointdense) * 5 AS sri, coverpct * (1 + lappct / 100.0 * (1 - coverpct / 100.0)) AS sce, noisedb FROM scanpointcloud), sqs AS (SELECT arcref, crewref, POWER(10.0 / sri, 1.5) * (sce / 100.0) * POWER(1 - noisedb / 30.0, 2) AS sqs FROM pc), esi AS (SELECT TRIM(zoneref) AS zoneref, 100 - 2.5 * ABS(ambictemp - 20) - POWER(ABS((humepct - 50) / 2.0), 1.5) - 600.0 / (illumelux + 100) AS esi FROM scanenvironment) SELECT AVG(q.sqs / (e.esi + 10) * 100) AS avg_eif FROM scans s JOIN sqs q ON q.arcref = TRIM(s.arcref) AND q.crewref = TRIM(s.crewref) JOIN esi e ON e.zoneref = TRIM(s.zoneref)
