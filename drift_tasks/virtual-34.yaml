id: virtual-34-gift-impact-quotient
database: virtual
question: What is the average Gift Impact Quotient (GIQ) over all interaction records?
drift_type: documented
entries:
- id: 34
  oracle_definition: GIQ = \frac{giftvalusd \times gifttot}{120}, \text{ producing an amplified measure of gifting significance by combining both quantity and monetary value.}
  stored_answer: GIQ = \frac{giftvalusd \times gifttot}{100}, \text{ producing an amplified measure of gifting significance by combining both quantity and monetary value.}
- id: 7
  oracle_definition: 'gifttot represents the total number of gifts sent by fans, typically classified as: fewer than 10 is considered minimal gifting, 10-50 represents moderate support, and above 50 indicates substantial support; giftvalusd represents the USD value of gifts, generally $1-5 for small support, $5-20 for moderate support, $20-100 for large support, and above $100 for super support. Both metrics combined assess a fan''s economic support level.'
  stored_answer: 'gifttot represents the total number of gifts sent by fans, typically classified as: fewer than 10 is considered minimal gifting, 10-50 represents moderate support, and above 50 indicates substantial support; giftvalusd represents the USD value of gifts, generally $1-5 for small support, $5-20 for moderate support, $20-100 for large support, and above $100 for super support. Both metrics combined assess a fan''s economic support level.'
