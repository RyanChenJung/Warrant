    - 23
    - 28
  gold_sql: SELECT AVG(p.powratew * p.tempcoef * (e.celltempc - 25)) AS avg_tpci FROM panel p JOIN environment e ON TRIM(e.arearegistry) = TRIM(p.hubregistry)
