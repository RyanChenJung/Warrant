id: solar-2-temperature-performance-coefficient-impact
database: solar
question: What is the average Temperature Performance Coefficient Impact (TPCI) over all panels, taking each panel's cell temperature from the environment reading of its plant?
drift_type: documented
entries:
- id: 2
  oracle_definition: TPCI = PowerRatedW \times TempCoef \times (CellTempC - 30), \text{where TempCoef is the temperature coefficient and 30°C is the standard test condition temperature.}
  stored_answer: TPCI = PowerRatedW \times TempCoef \times (CellTempC - 25), \text{where TempCoef is the temperature coefficient and 25°C is the standard test condition temperature.}
- id: 22
  oracle_definition: Expressed as a percentage per degree Celsius (usually negative), indicating how much a panel's power output decreases for each degree above 30°C. Typical values range from -0.25% to -0.50% per °C, with lower absolute values indicating better high-temperature performance.
  stored_answer: Expressed as a percentage per degree Celsius (usually negative), indicating how much a panel's power output decreases for each degree above 25°C. Typical values range from -0.25% to -0.50% per °C, with lower absolute values indicating better high-temperature performance.
- id: 35
  oracle_definition: WCE = CurrentEfficiencyPercent × (1 + TempCoef × (30 - CellTempC) / 100) × (1000 / POAIrradianceWM2), where CurrentEfficiencyPercent is from efficiency_profile.current_efficiency.curreffpct.
  stored_answer: WCE = CurrentEfficiencyPercent × (1 + TempCoef × (25 - CellTempC) / 100) × (1000 / POAIrradianceWM2), where CurrentEfficiencyPercent is from efficiency_profile.current_efficiency.curreffpct.
