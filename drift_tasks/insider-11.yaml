id: insider-11-potential-insider-trading-flag
database: insider
question: How many transactions are flagged by the Potential Insider Trading Flag?
drift_type: documented
entries:
- id: 11
  oracle_definition: A transaction is flagged if `infoleaksc` > 60.0 AND `corpeventprx` is NOT NULL AND `eventannotm` is 'Pre-market' or 'Intraday'.
  stored_answer: A transaction is flagged if `infoleaksc` > 50.0 AND `corpeventprx` is NOT NULL AND `eventannotm` is 'Pre-market' or 'Intraday'.
- id: 27
  oracle_definition: '`infoleaksc`: A score typically from 0-100. Low scores (<20) suggest little evidence of trading activity ahead of significant news or events. Moderate scores (20-60) warrant attention and may correlate with known events. High scores (>60) strongly suggest potential trading based on material non-public information, requiring investigation.'
  stored_answer: '`infoleaksc`: A score typically from 0-100. Low scores (<20) suggest little evidence of trading activity ahead of significant news or events. Moderate scores (20-50) warrant attention and may correlate with known events. High scores (>50) strongly suggest potential trading based on material non-public information, requiring investigation.'
- id: 33
  oracle_definition: 'WIS = \text{III} \times \text{AlertLevelMultiplier} \\ \text{where III is Investigation Intensity Index } \\ \text{and AlertLevelMultiplier maps Alert Level Severity  to numeric: ''Low''=1, ''Medium''=2, ''High''=3, ''Critical''=4.}'
  stored_answer: 'WIS = \text{III} \times \text{AlertLevelMultiplier} \\ \text{where III is Investigation Intensity Index } \\ \text{and AlertLevelMultiplier maps Alert Level Severity  to numeric: ''Low''=1, ''Medium''=2, ''High''=3, ''Critical''=4.}'
- id: 34
  oracle_definition: SWOV = \text{optvolrt} \times (1 + \text{SDF}) \\ \text{where SDF is the Sentiment Divergence Factor .}
  stored_answer: SWOV = \text{optvolrt} \times (1 + \text{SDF}) \\ \text{where SDF is the Sentiment Divergence Factor .}
- id: 6
  oracle_definition: III = (0.6 \times \text{behansc}) + (0.4 \times \text{netansc})
  stored_answer: III = (0.6 \times \text{behansc}) + (0.4 \times \text{netansc})
- id: 35
  oracle_definition: LEFI = \text{EFIR} \times \log_{10}(\text{Max}(10, \text{penamt})) \\ \text{where EFIR is the Enforcement Financial Impact Ratio .}
  stored_answer: LEFI = \text{EFIR} \times \log_{10}(\text{Max}(10, \text{penamt})) \\ \text{where EFIR is the Enforcement Financial Impact Ratio .}
- id: 7
  oracle_definition: SDF = |\text{newsscore} - \text{socscore}|
  stored_answer: SDF = |\text{newsscore} - \text{socscore}|
- id: 9
  oracle_definition: EFIR = \frac{\text{penamt}}{\text{acctbal}}
  stored_answer: EFIR = \frac{\text{penamt}}{\text{acctbal}}
